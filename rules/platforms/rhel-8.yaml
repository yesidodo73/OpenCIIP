schema_version: 1
id: rhel-8
priority: 200
selector:
  family: rhel
  version_major: "8"
bindings:
  - rule_id: U-02
    parameters:
      min_password_length: 8
      required_character_classes: 4
      password_history: 4
      min_password_days: 1
      max_password_days: 90
  - rule_id: U-13
    parameters:
      safe_login_defs_methods: [SHA256, SHA512, YESCRYPT]
      safe_shadow_algorithms: ["5", "6", "y", "gy"]
  - rule_id: U-12
    parameters:
      max_session_timeout_seconds: 600
