    severity: high
    evaluator: ""
    criteria:
      summary: "root 계정의 PATH 환경변수에 현재 디렉터리가 앞이나 중간에 포함되어 있는지 점검합니다."
      pass: "PATH 환경변수에 “.” 이 맨 앞이나 중간에 포함되지 않은 경우"
      fail: "PATH 환경변수에 “.” 이 맨 앞이나 중간에 포함된 경우"
      solution: "root 계정의 환경설정 파일(/.profile, /.bashrc 등)과 시스템 환경설정 파일(/etc/profile 등)에 설정된 PATH 환경변수에서 현재 디렉터리를 나타내는 “.”을 PATH 환경변수의 마지막으로 이동하도록 설정※/etc/profile 파일, root 계정, 일반 사용자 계정의 환경설정 파일을 순차적으로 검색하여 확인"
    reference:
      section: "Unix 서버 > 2. 파일 및 디렉토리 관리"
      pages: [39]

