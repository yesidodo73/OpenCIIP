schema_version: 1

guide:
  year: 2026
  title: "2026 주요정보통신기반시설 기술적 취약점 분석·평가 방법 상세가이드"
  domain: "Unix 서버"

rules:
  - id: U-01
    title: "root 계정 원격 접속 제한"
    category: account
    severity: high
    evaluator: ""
    criteria:
      summary: "원격터미널 서비스에서 root 계정의 직접 접속 차단 여부를 점검합니다."
      pass: "원격터미널 서비스를 사용하지 않거나, 사용 시 root 직접 접속을 차단한 경우"
      fail: "원격터미널 서비스 사용 시 root 직접 접속을 허용한 경우"
      solution: "원격 접속 시 root 계정으로 접속할 수 없도록 파일 내용 설정"
    reference:
      section: "Unix 서버 > 1. 계정 관리"
      pages: [12]

  - id: U-02
    title: "비밀번호 관리정책 설정"
    category: account
    severity: high
    evaluator: ""
    criteria:
      summary: "비밀번호 관리 정책의 설정 여부를 점검합니다."
      pass: "비밀번호 관리 정책이 설정된 경우"
      fail: "비밀번호 관리 정책이 설정되지 않은 경우"
      solution: "root 계정을 포함한 사용자 계정의 비밀번호를 영문, 숫자, 특수문자를 포함하여 최소 8자리 이상 및 최소 사용 기간 1일, 최대 사용 기간 90일, 최근 비밀번호 기억 4회 이상으로 설정"
    reference:
      section: "Unix 서버 > 1. 계정 관리"
      pages: [15]

  - id: U-03
    title: "계정 잠금 임계값 설정"
    category: account
    severity: high
    evaluator: ""
    criteria:
      summary: "로그인 실패에 대한 계정 잠금 임계값을 점검합니다."
      pass: "계정 잠금 임계값이 10회 이하의 값으로 설정된 경우"
      fail: "계정 잠금 임계값이 설정되어 있지 않거나, 10회 이하의 값으로 설정되지 않은 경우"
      solution: "계정 잠금 임계값을 10회 이하로 설정"
    reference:
      section: "Unix 서버 > 1. 계정 관리"
      pages: [21]

  - id: U-04
    title: "비밀번호 파일 보호"
    category: account
    severity: high
    evaluator: ""
    criteria:
      summary: "비밀번호의 쉐도우 사용 또는 암호화 저장 여부를 점검합니다."
      pass: "쉐도우 비밀번호를 사용하거나, 비밀번호를 암호화하여 저장하는 경우"
      fail: "쉐도우 비밀번호를 사용하지 않고, 비밀번호를 암호화하여 저장하지 않는 경우"
      solution: "비밀번호 암호화 저장·관리 설정"
    reference:
      section: "Unix 서버 > 1. 계정 관리"
      pages: [25]

  - id: U-05
    title: "root 이외의 UID가 ‘0’ 금지"
    category: account
    severity: high
    evaluator: ""
    criteria:
      summary: "root 계정과 동일한 UID를 사용하는 계정의 존재 여부를 점검합니다."
      pass: "root 계정과 동일한 UID를 갖는 계정이 존재하지 않는 경우"
      fail: "root 계정과 동일한 UID를 갖는 계정이 존재하는 경우"
      solution: "UID가 0으로 설정된 계정을 0 이외의 중복되지 않은 UID로 변경 또는 불필요한 계정인 경우 제거하도록 설정 (사용 중인 계정인 경우 명령어를 통한 조치가 적용되지 않을 수 있으므로 /etc/passwd 파일을 통해 변경)"
    reference:
      section: "Unix 서버 > 1. 계정 관리"
      pages: [27]

  - id: U-06
    title: "사용자 계정 su 기능 제한"
    category: account
    severity: high
    evaluator: ""
    criteria:
      summary: "su 명령어를 특정 그룹의 사용자만 사용할 수 있도록 제한했는지 점검합니다."
      pass: "su 명령어를 특정 그룹에 속한 사용자만 사용하도록 제한된 경우※ 일반 사용자 계정 없이 root 계정만 사용하는 경우 su 명령어 사용 제한 불필요"
      fail: "su 명령어를 모든 사용자가 사용하도록 설정된 경우"
      solution: "PAM 모듈 설정 또는 su 명령어 허용 그룹 생성 후 su 명령어 일반 사용자 권한 제거하도록 설정"
    reference:
      section: "Unix 서버 > 1. 계정 관리"
      pages: [29]

