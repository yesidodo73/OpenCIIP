schema_version: 1
recipes:
  - id: u19-hosts-permissions-rocky-9.7-amd64
    guide_year: 2026
    rule_id: U-19
    selector:
      id: rocky
      version: "9.7"
      architecture: amd64
    verification:
      state: verified
      environments:
        - Rocky Linux 9.7 amd64
      verified_at: "2026-08-02T14:58:30.339056Z"
      evidence_sha256:
        - a5aeb57ed649d1f3af16b6b5b44e6d147409f1692a44bf49a5cb28d60354dc4d
    risk: CAUTION
    expected_impact: "/etc/hosts의 내용, inode, GID, SELinux context와 이미 더 엄격한 권한을 보존하고, 필요한 경우에만 소유자를 root로 바꾸고 0644에서 허용하지 않는 권한 비트를 제거합니다. POSIX ACL 또는 SELinux 이외 확장 속성이 있으면 계획에서 제외합니다."
    operations:
      - type: preserve_content_file_metadata
        path: /etc/hosts
        allowed_owners: [root]
        remediation_owner: root
        maximum_mode: "0644"
  - id: u22-services-permissions-rocky-9.7-amd64
    guide_year: 2026
