schema_version: 1
recipes:
  - id: u19-hosts-permissions-ubuntu-20.04-amd64
    guide_year: 2026
    rule_id: U-19
    selector:
      id: ubuntu
      version: "20.04"
      architecture: amd64
    verification:
      state: verified
      environments:
        - Ubuntu 20.04 LTS amd64
      verified_at: "2026-08-02T14:58:30.339056Z"
      evidence_sha256:
        - dfa2caa86128f934ab062131d53bae680b64e1e610757338aaed08d265b02459
    risk: CAUTION
    expected_impact: "/etc/hosts의 내용, inode, GID와 이미 더 엄격한 권한을 보존하고, 필요한 경우에만 소유자를 root로 바꾸고 0644에서 허용하지 않는 권한 비트를 제거합니다. POSIX ACL 또는 지원하지 않는 확장 속성이 있으면 계획에서 제외합니다."
    operations:
      - type: preserve_content_file_metadata
        path: /etc/hosts
        allowed_owners: [root]
        remediation_owner: root
        maximum_mode: "0644"
